name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  language-handoff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/language_handoff
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/language_handoff/package-lock.json
      - run: npm ci
      - run: npm test
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true
      - run: uv sync --frozen
      - run: uv run pytest
      - run: uv sync --project examples/integrations/twilio --frozen
      - run: uv run --project examples/integrations/twilio pytest examples/integrations/twilio -q
      - run: uv sync --project examples/integrations/telnyx --frozen
      - run: uv run --project examples/integrations/telnyx pytest examples/integrations/telnyx -q
      - run: uv sync --project examples/integrations/custom_agents --frozen --extra livekit --extra elevenlabs --extra pipecat
      - run: uv run --project examples/integrations/custom_agents --extra livekit --extra elevenlabs --extra pipecat pytest examples/integrations/custom_agents -q
